<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>离线测试 · 阿里山AI获客</title>
  <link rel="stylesheet" href="./offline.css">
  <script src="./offline.js" defer></script>
</head>
<body>
  <main>
    <header><div><span class="eyebrow">阿里山AI获客 / 功能验收</span><h1>离线测试</h1><p>使用虚拟账号和固定样例，检查评论获客与养号流程。</p></div><span class="badge">仅模拟 · 真实操作关闭</span></header>
    <div class="notice">不会使用已登录账号，不会向平台发送内容。以下数字均为模拟结果，不计入真实业务统计。</div>
    <section class="card controls" aria-label="测试设置">
      <label>测试范围<select id="suite"><option value="all">完整流程（5 类动作）</option><option value="leadgen">评论获客（评论、回复、私信）</option><option value="nurture">养号（收藏、复制链接）</option></select></label>
      <label>测试场景<select id="scenario"><option value="success">正常执行</option><option value="uncertain">回执缺失，停止待确认</option><option value="declined">评论 / 私信被拒绝</option></select></label>
      <label>样例<select id="sample"><option value="A">样例 A</option><option value="B">样例 B</option></select></label>
      <button id="start" class="primary" type="button">开始离线测试</button>
      <button id="stop" type="button" disabled>停止测试</button>
      <p class="hint">再次运行相同场景和样例会检查去重。需要另一组数据时选择样例 B。模拟文案为固定测试内容，不调用 AI。</p>
    </section>
    <p id="error" role="alert" hidden></p>
    <section class="card" aria-live="polite">
      <div class="row"><h2 id="run-title">尚未开始</h2><span id="run-status">等待操作</span></div>
      <progress id="progress" max="100" value="0" aria-label="测试进度"></progress>
      <div id="counts" class="counts"></div>
      <p id="summary" class="hint">记录保存在本机，关闭面板不会停止测试。停止按钮会阻止后续动作。</p>
      <div class="table-scroll"><table><thead><tr><th>步骤</th><th>动作</th><th>模拟结果</th><th>说明</th></tr></thead><tbody id="logs"><tr><td colspan="4" class="empty">开始后，这里会逐步显示执行结果。</td></tr></tbody></table></div>
    </section>
    <section class="card"><div class="row"><h2>离线测试记录</h2><button id="refresh" type="button">刷新记录</button></div><p class="hint">保留最近 50 条展示记录。重启后可继续查看，已中断的测试不会自动重发。</p><div id="history" class="history">正在读取记录…</div></section>
  </main>
</body>
</html>
