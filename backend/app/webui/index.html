  <div class="setup-backdrop" id="setup-backdrop"><div class="setup-card"><div class="eyebrow">First setup</div><h2>先完成基础配置，再开始获客</h2><p>用几分钟告诉南溪AI获客你的产品、目标客户和沟通方式，后续 AI 才能生成更贴合业务的互动与私信。</p><div class="setup-steps" id="setup-steps"></div><div id="setup-content"></div><div class="setup-actions"><button class="button" id="setup-skip">稍后再填</button><button class="button primary" id="setup-next">开始配置</button></div></div></div>
  <script>
    const API_BASE=window.location.protocol==='file:'?'http://127.0.0.1:8000/api':'/api';const state={overview:{},leads:[],tasks:[],tool:'keyword',config:{}};window.state=state;const $=s=>document.querySelector(s);
    async function api(path,opt={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const r=await fetch(API_BASE+path.replace(/^\/api/,''),{...opt,signal:controller.signal});const b=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();if(!r.ok)throw Error(b.detail||b||r.statusText);return b}catch(error){if(error.name==='AbortError')throw Error('请求超时，请检查后端服务');throw error}finally{clearTimeout(timer)}}
    function toast(m){const n=$('#toast');n.textContent=m;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),3200)}
    function currentRoute(){return location.hash.replace(/^#/,'')||'home'}
    function refreshCurrentView(){const route=currentRoute();if(route==='home')renderWorkbench();else nav(route)}
    async function load(){try{[state.overview,state.leads,state.tasks]=await Promise.all([api('/overview'),api('/leads'),api('/tasks')]);refreshCurrentView()}catch(e){toast('连接后端失败：'+e.message)}}
    const setupFlow=[['product','产品知识库','告诉 AI 你卖什么、解决什么问题'],['audience','目标客户','定义行业、地区和客户需求'],['scripts','话术策略','配置评论、私信和异议处理方式'],['wechat','微信转化设置','设置引导时机、微信号和转化理由']];
    const setupFields={product:[['product_name','产品名称'],['description','产品介绍'],['selling_points','核心卖点'],['target_customers','适用客户'],['price_range','价格区间'],['faq','常见问题'],['forbidden_claims','禁止承诺']],audience:[['name','画像名称'],['industry','行业'],['region','地区'],['needs','客户需求'],['pain_points','客户痛点'],['intent_keywords','意向关键词'],['excluded_keywords','排除关键词']],scripts:[['comment_script','评论区话术'],['private_message_script','私信话术'],['wechat_script','微信引导话术'],['objection_script','异议处理话术']],wechat:[['wechat_id','微信号'],['guide_timing','引导时机'],['guide_reason','引导理由'],['compliance_note','合规备注']]};
    function configComplete(key){const value=state.config[key]||{};return (setupFields[key]||[]).filter(field=>String(value[field[0]]||'').trim()).length>=Math.max(1,Math.ceil((setupFields[key]||[]).length*.35))}
    function configProgress(){const completed=setupFlow.filter(step=>configComplete(step[0])).length;return {completed,total:setupFlow.length}}
    async function loadConfig(){const endpoints={product:'/workbench/product',audience:'/workbench/audience',scripts:'/workbench/scripts',wechat:'/workbench/wechat'};try{const values=await Promise.all(Object.values(endpoints).map(endpoint=>api(endpoint)));Object.keys(endpoints).forEach((key,index)=>state.config[key]=values[index]);refreshCurrentView()}catch(e){toast('基础配置读取失败：'+e.message)}}
    function renderSetupSteps(active){$('#setup-steps').innerHTML=setupFlow.map((step,index)=>`<div class="setup-step ${index===active?'active':''} ${configComplete(step[0])?'done':''}"><strong>${index+1}. ${step[1]}</strong><br>${configComplete(step[0])?'已完成':'待配置'}</div>`).join('')}
    function openSetup(start=0){let index=start;$('#setup-backdrop').classList.add('open');const render=()=>{const [key,title,desc]=setupFlow[index];renderSetupSteps(index);$('#setup-content').innerHTML=`<h3>${title}</h3><p>${desc}</p><div class="form-grid">${setupFields[key].map(field=>`<label>${field[1]}<textarea id="setup-${field[0]}" placeholder="请输入${field[1]}"></textarea></label>`).join('')}</div>`;const existing=state.config[key]||{};setupFields[key].forEach(field=>{const el=$(`#setup-${field[0]}`);el.value=existing[field[0]]||''});$('#setup-next').textContent=index===setupFlow.length-1?'完成配置':'保存并继续';$('#setup-next').onclick=async()=>{const body={};setupFields[key].forEach(field=>body[field[0]]=$(`#setup-${field[0]}`).value);try{state.config[key]=await api(`/workbench/${key}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(index<setupFlow.length-1){index+=1;render()}else{$('#setup-backdrop').classList.remove('open');localStorage.setItem('nanxi-setup-seen','1');renderWorkbench();toast('基础配置已完成')}}catch(e){toast('保存失败：'+e.message)}}};render() }
    function maybeOpenSetup(){if(!localStorage.getItem('nanxi-setup-seen'))openSetup(0)}
    function closeTool(){$('#modal-backdrop').classList.remove('open')}function openTool(tool){state.tool=tool;const t={keyword:'关键词获客',comment:'评论区获客',local:'同城获客',live:'直播间获客',ai:'智能询盘'};$('#modal-title').textContent=t[tool]||'开始自动获客';$('#tool-hint').textContent='将启动 MediaCrawler 采集抖音公开内容与评论，任务完成后自动筛选并导入线索池。';$('#modal-backdrop').classList.add('open')}
    async function submit(e){e.preventDefault();const p={keyword:$('#f-keyword').value.trim(),count:Number($('#f-count').value||10),max_comments_count:Number($('#f-comments').value||50),login_type:$('#f-login').value,headless:false};try{const t=await api('/crawler/live/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeTool();toast(t.status==='running'?'MediaCrawler 已启动，正在采集评论。':'任务启动失败：'+(t.error_message||'请检查 MediaCrawler 服务'));await load()}catch(e){toast('任务提交失败：'+e.message)}}

    async function renderPage(v){
      const page=$('#page-view'), home=$('#home-view'), workspace=document.querySelector('.workspace');
      if(v==='desktop'){
        home.classList.add('hidden');workspace.classList.remove('hidden');page.classList.remove('hidden');
        page.innerHTML=`<div class="desktop-workspace"><div class="desktop-header"><div><h2 class="page-title">平台浏览器</h2><p class="page-subtitle">在系统内登录平台，右侧浏览器会保留登录状态，供采集任务使用。</p></div><span class="badge" id="desktop-cdp-state">CDP 配置读取中</span></div><div class="desktop-controls"><button class="button" id="desktop-back">返回</button><button class="button" id="desktop-forward">前进</button><button class="button" id="desktop-reload">刷新</button><button class="button" data-platform="douyin">抖音</button><button class="button" data-platform="bilibili">B站</button><button class="button" data-platform="kuaishou">快手</button><button class="button" data-platform="xiaohongshu">小红书</button></div><div class="desktop-tip"><strong>使用方式</strong><span>先在右侧完成平台登录，再回到“获客任务”启动采集。平台回复和私信仍需人工确认。</span></div></div>`;
        const urls={douyin:'https://www.douyin.com',bilibili:'https://www.bilibili.com',kuaishou:'https://www.kuaishou.com',xiaohongshu:'https://www.xiaohongshu.com'};
        $('#desktop-back').onclick=()=>window.platformBrowser?.back();$('#desktop-forward').onclick=()=>window.platformBrowser?.forward();$('#desktop-reload').onclick=()=>window.platformBrowser?.reload();page.querySelectorAll('[data-platform]').forEach(button=>button.onclick=()=>window.platformBrowser?.open(urls[button.dataset.platform]));
        try{const cdp=await window.platformBrowser?.cdp();$('#desktop-cdp-state').textContent=cdp?`CDP ${cdp.port} · 浏览器已内置`:'浏览器工作区';}catch{ $('#desktop-cdp-state').textContent='浏览器工作区'; }return;
      }

      home.classList.add('hidden');workspace.classList.add('hidden');page.classList.remove('hidden');
      const titles={leads:['客户','集中查看所有客户，优先处理高意向客户'],followups:['跟进工作台','按照客户阶段推进下一次沟通'],tasks:['获客任务','创建获客任务并查看执行结果'],interaction:['互动中心','集中处理评论、私信和 AI 回复建议'],analytics:['经营分析','查看从线索到成交的完整转化结果'],settings:['业务设置','让 AI 和线索评分更懂你的业务']};
      const [title,subtitle]=titles[v]||titles.leads;
      if(v==='leads'){
        page.innerHTML=`<div><h2 class="page-title">${title}</h2><p class="page-subtitle">${subtitle}</p></div><div class="panel"><div class="panel-body"><div class="filter-bar"><input id="lead-search" placeholder="搜索昵称、关键词或备注"><select id="lead-status"><option value="">全部阶段</option><option value="new">新线索</option><option value="qualified">有效线索</option><option value="contacted">已联系</option><option value="replied">已回复</option><option value="follow_up">跟进中</option><option value="won">已成交</option><option value="lost">未成交</option></select><select id="lead-intent"><option value="">全部意向</option><option value="A">A级强意向</option><option value="B">B级潜在</option><option value="C">C级普通</option></select><button class="button primary" id="lead-filter">筛选</button></div></div></div><div class="panel"><div class="panel-body table-wrap"><table class="table"><thead><tr><th>客户</th><th>来源</th><th>意向</th><th>客户阶段</th><th>需求</th><th>成交金额</th><th>操作</th></tr></thead><tbody id="leads-table"></tbody></table></div></div>`;
        const renderLeads=()=>{const q=($('#lead-search').value||'').toLowerCase(),s=$('#lead-status').value,i=$('#lead-intent').value;const rows=state.leads.filter(x=>(!q||`${x.nickname}${x.source_keyword}${x.note}`.toLowerCase().includes(q))&&(!s||x.status===s)&&(!i||x.intent_level===i));$('#leads-table').innerHTML=rows.map(x=>`<tr><td><button class="link-button lead-detail" data-id="${x.id}"><strong>${x.nickname||'-'}</strong></button><br><small>${x.platform}</small></td><td>${x.source_keyword||'-'}</td><td><span class="badge">${x.intent_level||'C'}级 · ${x.score}</span></td><td><select class="lead-stage" data-id="${x.id}"><option value="new" ${x.status==='new'?'selected':''}>新线索</option><option value="qualified" ${x.status==='qualified'?'selected':''}>有效线索</option><option value="contacted" ${x.status==='contacted'?'selected':''}>已联系</option><option value="replied" ${x.status==='replied'?'selected':''}>已回复</option><option value="follow_up" ${x.status==='follow_up'?'selected':''}>跟进中</option><option value="won" ${x.status==='won'?'selected':''}>已成交</option><option value="lost" ${x.status==='lost'?'selected':''}>未成交</option></select></td><td>${x.customer_need||x.note||'-'}</td><td>${x.conversion_amount?`¥${x.conversion_amount}`:'-'}</td><td><input class="lead-amount" data-id="${x.id}" type="number" min="0" step="0.01" placeholder="金额"><button class="button lead-save" data-id="${x.id}">保存</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">暂无匹配客户</td></tr>';page.querySelectorAll('.lead-detail').forEach(button=>button.onclick=()=>openLeadDetail(button.dataset.id));page.querySelectorAll('.lead-save').forEach(button=>button.onclick=async()=>{const lead=state.leads.find(x=>x.id===button.dataset.id),stage=page.querySelector(`.lead-stage[data-id="${button.dataset.id}"]`).value,amount=Number(page.querySelector(`.lead-amount[data-id="${button.dataset.id}"]`).value||lead.conversion_amount||0);button.disabled=true;button.textContent='保存中…';try{const updated=await api(`/leads/${button.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:stage,conversion_amount:amount})});Object.assign(lead,updated);toast('客户阶段和成交金额已保存');await load()}catch(e){toast('保存失败：'+e.message)}finally{button.disabled=false;button.textContent='保存'}})};$('#lead-filter').onclick=renderLeads;renderLeads();
      }else if(v==='followups'){
        const due=state.leads.filter(x=>x.next_followup_at||x.status==='follow_up');page.innerHTML=`<div><h2 class="page-title">${title}</h2><p class="page-subtitle">${subtitle}</p></div><div class="detail-grid"><div class="detail-card"><span>待跟进客户</span><strong>${due.length}</strong></div><div class="detail-card"><span>强意向客户</span><strong>${state.leads.filter(x=>x.intent_level==='A').length}</strong></div><div class="detail-card"><span>已联系</span><strong>${state.leads.filter(x=>x.status==='contacted').length}</strong></div><div class="detail-card"><span>已成交</span><strong>${state.leads.filter(x=>x.status==='won').length}</strong></div></div><div class="panel"><div class="panel-head"><strong>待处理客户</strong><span class="section-caption">直接记录下一次动作</span></div><div class="panel-body list">${due.map(x=>`<div class="lead-row"><div><button class="link-button lead-detail" data-id="${x.id}"><strong>${x.nickname}</strong></button><small>${x.customer_need||x.note||'尚未记录客户需求'}</small></div><div class="status-actions"><input class="followup-date" data-id="${x.id}" type="datetime-local" value="${x.next_followup_at?new Date(x.next_followup_at).toISOString().slice(0,16):''}"><button class="button followup-save" data-id="${x.id}">保存</button></div></div>`).join('')||'<div class="empty">当前没有待跟进客户</div>'}</div></div>`;page.querySelectorAll('.lead-detail').forEach(button=>button.onclick=()=>openLeadDetail(button.dataset.id));page.querySelectorAll('.followup-save').forEach(button=>button.onclick=async()=>{const date=page.querySelector(`.followup-date[data-id="${button.dataset.id}"]`).value;if(!date){toast('请先选择下一次跟进时间');return}button.disabled=true;button.textContent='保存中…';try{await api('/followups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lead_id:button.dataset.id,event_type:'follow_up',content:'已安排下一次跟进',scheduled_at:new Date(date).toISOString(),result:''})});toast('下一次跟进已保存');await load()}catch(error){toast('保存失败：'+error.message)}finally{button.disabled=false;button.textContent='保存'}});
